<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>charts preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spartan:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: AliceBlue; }
    body {
        font-family: 'Spartan', sans-serif;
        color: #6387A7;
        padding: 1.5rem 1rem 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .control-frame {
        position: relative;
        width: min(54rem, 96vw);
        background: rgba(255,255,255,0.65);
        border: 0.25rem solid #DDECFB;
        border-radius: 1.5rem;
        box-shadow: 0 0.4rem 1.2rem rgba(99,135,167,0.15);
        margin-bottom: 1.5rem;
        padding: 1.2rem 1.6rem 1.6rem;
    }
    .panel-title {
        font-size: 1.4rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12rem;
        margin-bottom: 0.8rem;
    }
    #score-container, #telemetry-container {
        position: relative;
        width: 100%;
        height: 13rem;
        border: 0.15rem dashed rgba(99,135,167,0.25);
        border-radius: 0.8rem;
        overflow: hidden;
    }
    #hud {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        width: min(54rem, 96vw);
    }
    .btn {
        font-family: 'Spartan', sans-serif;
        font-size: 1.2rem;
        color: #fff;
        background: #8CBCE5;
        border: 0.25rem solid #8CBCE5;
        border-radius: 0.7rem;
        padding: 0.55rem 1.5rem;
        cursor: pointer;
    }
    .btn:hover { background: #7ea9ce; border-color: #7ea9ce; }
    .btn:active { background: #6387A7; border-color: #6387A7; }
    .badge {
        background: rgba(255,255,255,0.65);
        border: 0.25rem solid #DDECFB;
        border-radius: 1.5rem;
        box-shadow: 0 0.4rem 1.2rem rgba(99,135,167,0.15);
        padding: 0.6rem 1.2rem;
        text-align: center;
        min-width: 6.5rem;
    }
    .badge .cap {
        display: block;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08rem;
        color: #6387A7;
    }
    .badge .val {
        display: block;
        font-size: 1.6rem;
        font-weight: 700;
        color: #6387A7;
    }
    #stream-line {
        width: min(54rem, 96vw);
        text-align: center;
        font-size: 1rem;
        color: #6387A7;
        margin-bottom: 0.8rem;
    }
</style>
</head>
<body>

<div class="control-frame">
    <p class="panel-title">score</p>
    <div id="score-container"></div>
</div>

<div class="control-frame">
    <p class="panel-title">telemetry</p>
    <div id="telemetry-container"></div>
</div>

<div id="stream-line">gen <span id="gen-val">0</span> · t <span id="t-val">0.0</span>s</div>

<div id="hud">
    <button type="button" class="btn" id="btn-reset">reset</button>
    <div class="badge"><span class="cap">fps</span><span class="val" id="fps-val">—</span></div>
</div>

<script src="../js/charts.js"></script>
<script>
( function () {
    "use strict";

    function mulberry32( a ) {
        return function () {
            a |= 0;
            a = a + 0x6D2B79F5 | 0;
            let t = Math.imul( a ^ a >>> 15, 1 | a );
            t = t + Math.imul( t ^ t >>> 7, 61 | t ) ^ t;
            return ( ( t ^ t >>> 14 ) >>> 0 ) / 4294967296;
        };
    }

    const rng = mulberry32( 424242 );
    const fpsEl = document.getElementById( "fps-val" );
    const genEl = document.getElementById( "gen-val" );
    const tEl = document.getElementById( "t-val" );
    let gen = 0;
    let t = 0;
    let frames = 0;
    let fpsT = performance.now();

    function tickScore() {
        gen++;
        const best = Math.min( 480, 480 * ( 1 - Math.exp( -gen / 15 ) ) + ( rng() - 0.5 ) * 4 );
        const mean = Math.max( 0, best * ( 0.86 + 0.1 * rng() ) );
        RL.charts.pushScore( { x: gen, best: best, mean: mean } );
        genEl.textContent = String( gen );
    }

    function tickTele() {
        t = Math.round( ( t + 0.1 ) * 10 ) / 10;
        const speed = 1.6 * Math.sin( t * 2.1 ) + 0.3 * Math.sin( t * 7.3 );
        const theta = 0.9 * Math.sin( t * 1.4 ) + 0.2 * Math.sin( t * 5.9 );
        RL.charts.pushTelemetry( { t: t, speed: speed, theta: theta } );
        tEl.textContent = t.toFixed( 1 );
    }

    function loop( now ) {
        frames++;
        if( now - fpsT >= 500 ) {
            fpsEl.textContent = ( frames * 1000 / ( now - fpsT ) ).toFixed( 1 );
            frames = 0;
            fpsT = now;
        }
        requestAnimationFrame( loop );
    }

    document.getElementById( "btn-reset" ).addEventListener( "click", function () {
        RL.charts.reset();
        gen = 0;
        t = 0;
        genEl.textContent = "0";
        tEl.textContent = "0.0";
    } );

    RL.charts.initScore();
    RL.charts.initTelemetry();
    setInterval( tickScore, 100 );
    setInterval( tickTele, 100 );
    tickScore();
    tickTele();
    requestAnimationFrame( loop );

} )();
</script>

</body>
</html>
