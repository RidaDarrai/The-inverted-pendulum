<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nn-viz preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spartan:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: AliceBlue; }
    body {
        font-family: 'Spartan', sans-serif;
        color: #6387A7;
        padding: 1.5rem 1rem 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .control-frame {
        position: relative;
        width: min(54rem, 96vw);
        background: rgba(255,255,255,0.65);
        border: 0.25rem solid #DDECFB;
        border-radius: 1.5rem;
        box-shadow: 0 0.4rem 1.2rem rgba(99,135,167,0.15);
        margin-bottom: 1.5rem;
        padding: 1.2rem 1.6rem 1.6rem;
    }
    .panel-title {
        font-size: 1.4rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12rem;
        margin-bottom: 0.8rem;
    }
    #nn-container {
        position: relative;
        width: 100%;
        height: 22rem;
        border: 0.15rem dashed rgba(99,135,167,0.25);
        border-radius: 0.8rem;
        overflow: hidden;
    }
    #hud {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        width: min(54rem, 96vw);
    }
    .btn {
        font-family: 'Spartan', sans-serif;
        font-size: 1.2rem;
        color: #fff;
        background: #8CBCE5;
        border: 0.25rem solid #8CBCE5;
        border-radius: 0.7rem;
        padding: 0.55rem 1.5rem;
        cursor: pointer;
    }
    .btn:hover { background: #7ea9ce; border-color: #7ea9ce; }
    .btn.active { background: #6387A7; border-color: #6387A7; }
    .badge {
        background: rgba(255,255,255,0.65);
        border: 0.25rem solid #DDECFB;
        border-radius: 1.5rem;
        box-shadow: 0 0.4rem 1.2rem rgba(99,135,167,0.15);
        padding: 0.6rem 1.2rem;
        text-align: center;
        min-width: 6.5rem;
    }
    .badge .cap {
        display: block;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08rem;
        color: #6387A7;
    }
    .badge .val {
        display: block;
        font-size: 1.6rem;
        font-weight: 700;
        color: #6387A7;
    }
    #obs-line {
        width: min(54rem, 96vw);
        text-align: center;
        font-size: 1rem;
        color: #6387A7;
        margin-bottom: 0.8rem;
    }
</style>
</head>
<body>

<div class="control-frame">
    <p class="panel-title">policy network — nn preview</p>
    <div id="nn-container"></div>
</div>

<div id="obs-line">obs <span id="obs-val">0.00 0.00 0.00 0.00</span> · action <span id="act-val">—</span> · p(←) <span id="prob-val">0.50</span></div>

<div id="hud">
    <button type="button" class="btn active" id="btn-deterministic">deterministic</button>
    <button type="button" class="btn" id="btn-stochastic">stochastic</button>
    <div class="badge"><span class="cap">fps</span><span class="val" id="fps-val">—</span></div>
</div>

<script src="../js/vendor/d3.min.js"></script>
<script src="../js/nn-viz.js"></script>
<script>
( function () {
    "use strict";

    function mulberry32( a ) {
        return function () {
            a |= 0;
            a = a + 0x6D2B79F5 | 0;
            let t = Math.imul( a ^ a >>> 15, 1 | a );
            t = t + Math.imul( t ^ t >>> 7, 61 | t ) ^ t;
            return ( ( t ^ t >>> 14 ) >>> 0 ) / 4294967296;
        };
    }

    const rng = mulberry32( 20260928 );
    const rngAct = mulberry32( 777 );
    const CLAMP = [ [ -1.5, 1.5 ], [ -2, 2 ], [ -0.5, 0.5 ], [ -2, 2 ] ];
    const obs = [ 0, 0, 0, 0 ];
    let W = null;
    let b = null;
    let stochastic = false;
    let frames = 0;
    let fpsT = performance.now();

    const fpsEl = document.getElementById( "fps-val" );
    const obsEl = document.getElementById( "obs-val" );
    const actEl = document.getElementById( "act-val" );
    const probEl = document.getElementById( "prob-val" );
    const btnDet = document.getElementById( "btn-deterministic" );
    const btnSto = document.getElementById( "btn-stochastic" );

    function setMode( sto ) {
        stochastic = sto;
        btnDet.classList.toggle( "active", !sto );
        btnSto.classList.toggle( "active", sto );
    }
    btnDet.addEventListener( "click", function () { setMode( false ); } );
    btnSto.addEventListener( "click", function () { setMode( true ); } );

    function forward( o ) {
        let a = o;
        const acts = [];
        for( let l = 0; l < W.length; l++ ) {
            const m = W[ l ];
            const bias = b[ l ];
            const out = new Array( m.length );
            for( let j = 0; j < m.length; j++ ) {
                const row = m[ j ];
                let s = bias[ j ];
                for( let i = 0; i < row.length; i++ ) s += row[ i ] * a[ i ];
                out[ j ] = s;
            }
            if( l < W.length - 1 ) {
                for( let j = 0; j < out.length; j++ ) out[ j ] = Math.tanh( out[ j ] );
            } else {
                let mx = out[ 0 ];
                for( let j = 1; j < out.length; j++ ) if( out[ j ] > mx ) mx = out[ j ];
                let sum = 0;
                for( let j = 0; j < out.length; j++ ) { out[ j ] = Math.exp( out[ j ] - mx ); sum += out[ j ]; }
                for( let j = 0; j < out.length; j++ ) out[ j ] /= sum;
            }
            acts.push( out );
            a = out;
        }
        const probs = acts[ acts.length - 1 ];
        let action;
        if( stochastic ) action = rngAct() < probs[ 0 ] ? 0 : 1;
        else action = probs[ 0 ] >= probs[ 1 ] ? 0 : 1;
        return { action: action, probs: probs, activations: acts };
    }

    function loop( t ) {
        frames++;
        if( t - fpsT >= 500 ) {
            fpsEl.textContent = ( frames * 1000 / ( t - fpsT ) ).toFixed( 1 );
            frames = 0;
            fpsT = t;
        }
        for( let i = 0; i < 4; i++ ) {
            obs[ i ] += ( rng() - 0.5 ) * 0.14;
            if( obs[ i ] < CLAMP[ i ][ 0 ] ) obs[ i ] = CLAMP[ i ][ 0 ];
            if( obs[ i ] > CLAMP[ i ][ 1 ] ) obs[ i ] = CLAMP[ i ][ 1 ];
        }
        const r = forward( obs );
        window.RL.nnviz.update( obs, r );
        obsEl.textContent = obs.map( function ( v ) { return v.toFixed( 2 ); } ).join( " " );
        actEl.textContent = r.action === 0 ? "← (0)" : "→ (1)";
        probEl.textContent = r.probs[ 0 ].toFixed( 2 );
        requestAnimationFrame( loop );
    }

    fetch( "../data/policy.json" )
        .then( function ( r ) { return r.json(); } )
        .then( function ( policy ) {
            W = policy.W;
            b = policy.b;
            window.RL.nnviz.init();
            window.RL.nnviz.setPolicy( policy );
            const r0 = forward( obs );
            window.RL.nnviz.update( obs, r0 );
            requestAnimationFrame( loop );
        } )
        .catch( function ( e ) {
            fpsEl.textContent = "err";
            console.error( e );
        } );

} )();
</script>

</body>
</html>
